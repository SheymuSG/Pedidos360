spring.application.name=backend

server.port=8080
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/60225265-62c9-4c77-9743-143b5ee0ab82/v2.0

logging.level.org.springframework.security=TRACE

# ==========================================
# CONEXIÓN A BASE DE DATOS MYSQL LOCAL
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/pedidos360_db?createDatabaseIfNotExist=true
spring.datasource.username=root
# OJO: Cambia "tu_contraseña" por la clave de tu MySQL. Si no tiene clave, déjalo así: spring.datasource.password=
spring.datasource.password=
# ==========================================
# HIBERNATE (Creador automático de tablas)
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true