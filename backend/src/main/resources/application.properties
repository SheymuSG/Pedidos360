spring.application.name=backend

server.port=8080

# ==========================================
# SEGURIDAD - MICROSOFT ENTRA ID (OAuth2 Resource Server)
# ==========================================
# Reemplaza <TENANT_ID> por el Directory (tenant) ID que aparece en "Tenant details".
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/${AZURE_TENANT_ID:404d6b8a-6f61-411a-98f7-3ae685d26aaa}/v2.0

# Application ID URI del registro "Pedidos360-API" (Exponer una API). Ejemplo: api://f3136620-xxxx
pedidos360.security.audience=${AZURE_API_AUDIENCE:api://49673b38-d477-4cb1-b6c3-01806c189fe0}

# Origenes permitidos para CORS (frontend Angular). Separar por comas si hay mas de uno.
pedidos360.security.allowed-origins=${PEDIDOS360_ALLOWED_ORIGINS:http://localhost:4200}

logging.level.org.springframework.security=INFO

# ==========================================
# CONEXION A BASE DE DATOS MYSQL
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/pedidos360_db?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ==========================================
# HIBERNATE (Creador automatico de tablas)
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
