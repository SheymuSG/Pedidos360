spring:
  application:
    name: backend

  # ==========================================
  # SEGURIDAD - MICROSOFT ENTRA ID (OAuth2 Resource Server)
  # ==========================================
  security:
    oauth2:
      resourceserver:
        jwt:
          # Directory (tenant) ID de Entra ID. Se puede sobreescribir con AZURE_TENANT_ID.
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:404d6b8a-6f61-411a-98f7-3ae685d26aaa}/v2.0

  # ==========================================
  # CONEXION A BASE DE DATOS MYSQL
  # ==========================================
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/pedidos360_db?createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  # ==========================================
  # HIBERNATE (Creador automatico de tablas)
  # ==========================================
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  # ==========================================
  # RABBITMQ (cluster de 2 nodos: se listan ambos como direcciones de failover)
  # ==========================================
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated   # el broker confirma cada publicacion
    publisher-returns: true              # avisa si un mensaje no es enrutable
    template:
      mandatory: true

server:
  port: 8080

logging:
  level:
    org.springframework.security: INFO

pedidos360:
  security:
    # Application ID URI del registro "Pedidos360-API" (Exponer una API).
    audience: ${AZURE_API_AUDIENCE:api://49673b38-d477-4cb1-b6c3-01806c189fe0}
    # Origenes permitidos para CORS (frontend Angular). Separar por comas si hay mas de uno.
    allowed-origins: ${PEDIDOS360_ALLOWED_ORIGINS:http://localhost:4200}
    # SOLO perfil "local": secreto HS256 para tokens de prueba. Sin valor por defecto a proposito.
    local-jwt-secret: ${LOCAL_JWT_SECRET}

  # ==========================================
  # MENSAJERIA - nombres centralizados (unica fuente de verdad del productor)
  # ==========================================
  messaging:
    exchanges:
      events: pedidos.events.exchange   # TOPIC  -> eventos de dominio
      tasks: pedidos.tasks.exchange     # DIRECT -> comandos a un trabajador
    routing-keys:
      pedido-creado: pedido.creado
      documento-generar: documento.generar
