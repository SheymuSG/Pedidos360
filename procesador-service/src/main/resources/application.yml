spring:
  application:
    name: procesador-service

  # ==========================================
  # RABBITMQ (cluster de 2 nodos: ambos como direcciones de failover)
  # ==========================================
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        # Confirmacion explicita: cada consumidor hace ACK/NACK (ver AckingMessageProcessor).
        acknowledge-mode: manual
        # Un mensaje sin confirmar a la vez por consumidor: reparto justo y backoff observable.
        prefetch: 1
        # Si algo se escapa del listener nunca se reencola en bucle.
        default-requeue-rejected: false

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health

pedidos360:
  processor:
    # Simulacion didactica de fallos (#FAIL-TICKET, #INVALID-TICKET, #FLAKY-TICKET ...).
    # Dejar en false en produccion.
    failure-simulation: ${FAILURE_SIMULATION:true}
    documents-dir: ${DOCUMENTS_DIR:./generated-documents}

  # ==========================================
  # MENSAJERIA - nombres centralizados (unica fuente de verdad del consumidor)
  # ==========================================
  messaging:
    exchanges:
      events: pedidos.events.exchange        # TOPIC  - eventos de dominio
      tasks: pedidos.tasks.exchange          # DIRECT - comandos
      dead-letter: pedidos.dlx               # DIRECT - DLX comun
    queues:
      notificaciones:
        name: notificaciones.queue
        binding-key: "pedido.*"              # topic: cualquier evento de pedido
        dlq: notificaciones.dlq
        dead-letter-key: notificaciones.dead
      tickets:
        name: tickets.queue
        binding-key: pedido.creado           # topic: solo creacion
        dlq: tickets.dlq
        dead-letter-key: tickets.dead
      documentos:
        name: documentos.queue
        binding-key: documento.generar       # direct: coincidencia exacta
        dlq: documentos.dlq
        dead-letter-key: documentos.dead
    dead-letter:                             # politica de retencion de las DLQ
      retention-ms: 86400000                 # 24 h
      max-length: 10000                      # maximo de mensajes retenidos
    retry:                                   # reintentos ante errores recuperables
      max-attempts: 3
      initial-interval-ms: 1000
      multiplier: 2.0
      max-interval-ms: 10000
