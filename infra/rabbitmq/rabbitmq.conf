# Formacion automatica del cluster: cada nodo conoce a los dos miembros.
# El primero en arrancar queda solo; el segundo se une a el.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit2

# Evita que un nodo reiniciado se quede esperando indefinidamente a su par.
cluster_formation.node_cleanup.interval = 30
cluster_formation.node_cleanup.only_log_warning = true
